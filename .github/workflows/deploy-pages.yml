name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            chicken-road/package-lock.json
            chicken-crash/package-lock.json
            chicken-road-unfinished/package-lock.json
            chicken-pilot/package-lock.json

      - name: Install Chicken Road dependencies
        working-directory: chicken-road
        run: npm ci

      - name: Build Chicken Road
        working-directory: chicken-road
        run: npm run build

      - name: Install Chicken Crash dependencies
        working-directory: chicken-crash
        run: npm ci

      - name: Build Chicken Crash
        working-directory: chicken-crash
        run: npm run build

      - name: Install Chicken Road Unfinished dependencies
        working-directory: chicken-road-unfinished
        run: npm ci

      - name: Build Chicken Road Unfinished
        working-directory: chicken-road-unfinished
        run: npm run build

      - name: Install Chicken Pilot dependencies
        working-directory: chicken-pilot
        run: npm ci

      - name: Build Chicken Pilot
        working-directory: chicken-pilot
        run: npm run build

      - name: Assemble Pages bundle
        run: |
          mkdir -p pages-bundle/chicken-road pages-bundle/chicken-crash pages-bundle/chicken-road-unfinished pages-bundle/chicken-pilot
          cp -R chicken-road/dist/. pages-bundle/chicken-road/
          cp -R chicken-crash/dist/. pages-bundle/chicken-crash/
          cp -R chicken-road-unfinished/dist/. pages-bundle/chicken-road-unfinished/
          cp -R chicken-pilot/dist/. pages-bundle/chicken-pilot/
          cp pages-index.html pages-bundle/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-bundle

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
